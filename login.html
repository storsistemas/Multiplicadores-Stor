<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Multiplicadores Stor</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
</head>
<body>
    <div class="container auth-container">
        <div class="card">
            <h2>Login</h2>
            <div id="flash"></div>
            <form id="loginForm">
                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" required placeholder="seu@email.com">
                </div>
                <div class="form-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password" name="password" required placeholder="Sua senha">
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%;margin-top:10px">Entrar</button>
            </form>
            <p class="text-center mt-10">
                Ainda não tem conta? <a href="register.html">Cadastre-se</a>
            </p>
        </div>
    </div>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            if (!email || !password) return showError('Preencha todos os campos.');

            try {
                await login(email, password);
                window.location.href = 'dashboard.html';
            } catch (err) {
                showError(err.message);
            }
        });

        auth.onAuthStateChanged(user => {
            if (user) window.location.href = 'dashboard.html';
        });
    </script>
</body>
</html>
