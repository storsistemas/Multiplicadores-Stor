<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranking - Multiplicadores Stor</title>
    <link rel="stylesheet" href="style.css?v=2">
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <script src="js/config.js?v=2"></script>
    <script src="js/app.js?v=2"></script>
</head>
<body>
    <div class="header">
        <h1>Multiplicadores Stor</h1>
    </div>
    <div class="nav">
        <a href="dashboard.html">&#x1F5E1; Missões</a>
        <a href="ranking.html">&#x1F451; Ranking</a>
        <a href="admin.html" id="adminLink" style="display:none;">&#x1F6E1; Admin</a>
        <a href="#" id="logoutBtn">&#x1F6AA; Sair</a>
    </div>

    <div class="container">
        <div class="card">
            <h2>&#x1F451; Ranking dos Aventureiros</h2>
            <div id="flash"></div>
            <ul class="ranking-list" id="rankingList"></ul>
        </div>
    </div>

    <script>
        async function loadRanking() {
            const user = await requireAuth();
            if (!user) return;
            const approved = await requireApproved();
            if (!approved) return;
            const currentUserId = user.uid;

            const users = await getRanking();
            const list = document.getElementById('rankingList');
            list.innerHTML = '';

            if (users.length === 0) {
                list.innerHTML = '<p class="text-center">Nenhum aventureiro cadastrado ainda.</p>';
                return;
            }

            users.forEach((u, i) => {
                const li = document.createElement('li');
                let posHtml;
                if (u.total_score === 0) {
                    posHtml = '<span style="color:#6b5b4a;">N/A</span>';
                } else if (i === 0) {
                    posHtml = '<span class="rank-medal">&#x1F947;</span>';
                } else if (i === 1) {
                    posHtml = '<span class="rank-medal">&#x1F948;</span>';
                } else if (i === 2) {
                    posHtml = '<span class="rank-medal">&#x1F949;</span>';
                } else {
                    posHtml = '#' + (i + 1);
                }

                const r = getRank(u.total_score);
                const isMe = u.id === currentUserId;
                li.innerHTML = `
                    <span class="pos">${posHtml}</span>
                    <span class="name">${u.nome} <span class="title-tag">${r.icon} ${r.title}</span></span>
                    <span class="score">
                        ${u.total_score} XP
                        ${isMe ? '<span class="badge badge-warning">Voc\u00ea</span>' : ''}
                    </span>
                `;
                list.appendChild(li);
            });
        }

        document.getElementById('logoutBtn').addEventListener('click', async (e) => {
            e.preventDefault();
            clearAdminCache();
            await logout();
            window.location.href = 'index.html';
        });

        auth.onAuthStateChanged(async u => {
            const link = document.getElementById('adminLink');
            if (link) {
                const admin = u ? await isAdmin(u) : false;
                link.style.display = admin ? '' : 'none';
            }
            loadRanking();
        });
    </script>
</body>
</html>
