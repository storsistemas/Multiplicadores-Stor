<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Multiplicadores Stor</title>
    <link rel="stylesheet" href="style.css?v=2">
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <script src="js/config.js?v=2"></script>
    <script src="js/app.js?v=2"></script>
</head>
<body>
    <div class="container auth-container">
        <div class="card">
            <h2><img src="img/stor-logo.png" alt="" class="logo-rpg-sm"> Criar Personagem</h2>
            <div id="flash"></div>
            <form id="registerForm">
                <div class="form-group">
                    <label for="name">Nome</label>
                    <input type="text" id="name" name="name" required placeholder="Seu nome completo">
                </div>
                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" required placeholder="seu@email.com">
                </div>
                <div class="form-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password" name="password" required placeholder="Sua senha" minlength="6">
                </div>
                <div class="form-group">
                    <label for="confirm_password">Confirmar Senha</label>
                    <input type="password" id="confirm_password" name="confirm_password" required placeholder="Confirme sua senha">
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%;margin-top:10px">Criar Personagem</button>
            </form>
            <p class="text-center mt-10">
                Já é um aventureiro? <a href="login.html">Entrar na Campanha</a>
            </p>
        </div>
    </div>
    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirm_password').value;

            if (!name || !email || !password) return showError('Todos os campos são obrigatórios.');
            if (password !== confirm) return showError('As senhas não conferem.');
            if (password.length < 6) return showError('A senha deve ter no mínimo 6 caracteres.');

            try {
                await register(name, email, password);
                showSuccess('Conta criada com sucesso! Redirecionando...');
                setTimeout(() => window.location.href = 'dashboard.html', 2000);
            } catch (err) {
                showError(err.message);
            }
        });
    </script>
</body>
</html>
