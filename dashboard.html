<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Missões - Multiplicadores Stor</title>
    <link rel="stylesheet" href="style.css?v=2">
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <script src="js/config.js?v=2"></script>
    <script src="js/app.js?v=2"></script>
</head>
<body>
    <div class="header">
        <h1>Multiplicadores Stor</h1>
    </div>
    <div class="nav">
        <a href="index.html">&#x1F3E0; Home</a>
        <a href="dashboard.html">&#x1F5E1; Missões</a>
        <a href="ranking.html">&#x1F451; Ranking</a>
        <a href="admin.html" id="adminLink" style="display:none;">&#x1F6E1; Admin</a>
        <a href="#" id="logoutBtn">&#x1F6AA; Sair</a>
    </div>

    <div class="container">
        <div id="flash"></div>

        <div class="highlight-card">
            <h2><img src="img/stor-logo.png" alt="" class="logo-rpg-sm"> Em Destaque</h2>
            <div class="stats-row">
                <div class="stat">
                    <div class="stat-label">Nome</div>
                    <div class="stat-value small" id="userName">-</div>
                </div>
                <div class="stat">
                    <div class="stat-label">Rank</div>
                    <div class="stat-value" id="userRank">#-</div>
                </div>
                <div class="stat">
                    <div class="stat-label">Título</div>
                    <div class="stat-value" id="userTitle">-</div>
                    <div class="stat-next" id="userNextRank"></div>
                </div>
                <div class="stat">
                    <div class="stat-label">Experiência</div>
                    <div class="stat-value" id="userScore">0 XP</div>
                </div>
            </div>
        </div>

        <div class="card">
            <h3>&#x1F4DC; Lista das Missões</h3>
            <div id="activitiesList"></div>
        </div>
    </div>

    <script>
        let currentUser = null;

        async function loadDashboard() {
            const user = await requireAuth();
            if (!user) return;
            currentUser = user;

            const profile = await getProfile(user.uid);
            if (!profile) {
                document.getElementById('userName').textContent = 'Aventureiro';
                document.getElementById('userScore').textContent = '0 XP';
                document.getElementById('userRank').textContent = '#-';
                document.getElementById('activitiesList').innerHTML =
                    '<p class="text-center" style="padding:20px;color:#8a7a6a;">Perfil não encontrado.</p>';
                return;
            }
            document.getElementById('userName').textContent = profile.name;
            document.getElementById('userScore').textContent = profile.total_score + ' XP';

            const ranking = await getRanking();
            const rankPos = profile.total_score > 0
                ? '#' + (ranking.findIndex(u => u.id === user.uid) + 1)
                : 'N/A';
            document.getElementById('userRank').textContent = rankPos;

            const rank = getRank(profile.total_score);
            const nextRank = getNextRank(profile.total_score);
            const titleEl = document.getElementById('userTitle');
            titleEl.innerHTML = rank.icon + ' ' + rank.title;
            const nextEl = titleEl.nextElementSibling;
            if (nextRank) {
                const needed = nextRank.xp - profile.total_score;
                if (needed > 0) {
                    nextEl.textContent = needed + ' XP para ' + nextRank.icon + ' ' + nextRank.title;
                } else {
                    nextEl.textContent = '';
                }
            } else {
                nextEl.textContent = 'Rank máximo atingido!';
            }

            const grupos = await getActivities(user.uid);
            const list = document.getElementById('activitiesList');
            list.innerHTML = '';

            if (grupos.length === 0) {
                list.innerHTML = '<p class="text-center" style="padding:30px;color:#8a7a6a;">Nenhuma missão disponível.</p>';
                return;
            }

            for (const grupo of grupos) {
                const s = grupo.steps[0];
                if (!s) continue;
                const done = s.completed;
                const div = document.createElement('div');
                div.className = 'activity-item' + (done ? ' completed' : '');

                let html = `<div class="title">${getSealIcon(grupo.type, done)} ${grupo.label}</div>`;

                if (grupo.type === 'voluntariar') {
                    html += `<div class="meta">
                        <form onsubmit="return handleToggle(event, '${s.id}', 'voluntariar')">
                            ${!done
                                ? '<button type="submit" class="btn btn-success btn-sm">Aceitar Missão</button>'
                                : '<button type="submit" class="btn btn-warning btn-sm">Desfazer</button>'}
                        </form>
                    </div>`;

                } else if (grupo.type === 'escolher_modulo') {
                    html += `<div class="meta">
                        <form class="meta-row" onsubmit="return handleToggle(event, '${s.id}', 'escolher_modulo')">
                            ${!done
                                ? `<input type="text" name="modulo" class="inline-input" placeholder="Nome do Módulo/Sistema" required>
                                   <button type="submit" class="btn btn-success btn-sm">Escolher</button>`
                                : `<strong>Módulo:</strong> ${s.modulo || '-'}
                                   <button type="submit" class="btn btn-warning btn-sm">Desfazer</button>`}
                        </form>
                    </div>`;

                } else if (grupo.type === 'iniciar_estudos') {
                    html += `<div class="meta">
                        <form class="meta-row" onsubmit="return handleToggle(event, '${s.id}', 'iniciar_estudos')">
                            ${!done
                                ? `<input type="date" name="data_inicio" class="inline-input" required>
                                   <button type="submit" class="btn btn-success btn-sm">Iniciar</button>`
                                : `<strong>Data de início:</strong> ${s.data_inicio || '-'}
                                   <button type="submit" class="btn btn-warning btn-sm">Desfazer</button>`}
                        </form>
                    </div>`;

                } else if (grupo.type === 'concluir_estudos') {
                    html += `<div class="meta">
                        <form class="meta-row" onsubmit="return handleToggle(event, '${s.id}', 'concluir_estudos')">
                            ${!done
                                ? `<input type="date" name="data_conclusao" class="inline-input" required>
                                   <button type="submit" class="btn btn-success btn-sm">Concluir</button>`
                                : `<strong>Data de conclusão:</strong> ${s.data_termino || '-'}
                                   <button type="submit" class="btn btn-warning btn-sm">Desfazer</button>`}
                        </form>
                    </div>`;

                } else if (grupo.type === 'iniciar_material') {
                    html += `<div class="meta">
                        <form class="meta-row" onsubmit="return handleToggle(event, '${s.id}', 'iniciar_material')">
                            ${!done
                                ? `<input type="date" name="data_inicio" class="inline-input" required>
                                   <button type="submit" class="btn btn-success btn-sm">Iniciar</button>`
                                : `<strong>Data de início:</strong> ${s.data_inicio || '-'}
                                   <button type="submit" class="btn btn-warning btn-sm">Desfazer</button>`}
                        </form>
                    </div>`;

                } else if (grupo.type === 'material_aprovado') {
                    html += `<div class="meta">
                        <form class="meta-row" onsubmit="return handleToggle(event, '${s.id}', 'material_aprovado')">
                            ${!done
                                ? `<input type="date" name="data_inicio" class="inline-input" required>
                                   <button type="submit" class="btn btn-success btn-sm">Aprovar Material</button>`
                                : `<strong>Data de aprovação:</strong> ${s.data_inicio || '-'}
                                   <button type="submit" class="btn btn-warning btn-sm">Desfazer</button>`}
                        </form>
                    </div>
                    <div class="link-info">
                        <strong>Link do Material</strong>
                        ${s.link ? `<a href="${s.link}" target="_blank">${s.link}</a>` : ''}
                        <form class="meta-row" onsubmit="return handleLink(event, '${s.id}')" style="margin-top:4px">
                            <input type="url" name="link" class="inline-input" placeholder="URL do material para avaliação" value="${s.link || ''}" style="width:280px">
                            <button type="submit" class="btn btn-primary btn-sm">Enviar para Revisão</button>
                        </form>
                    </div>`;

                } else if (grupo.type === 'ministrar_aula') {
                    html += `<div class="meta">
                        <form class="meta-row" onsubmit="return handleToggle(event, '${s.id}', 'ministrar_aula')">
                            ${!done
                                ? `<input type="date" name="data_aula" class="inline-input" required>
                                   <button type="submit" class="btn btn-success btn-sm">Registrar Aula</button>`
                                : `<strong>Data da aula:</strong> ${s.data_termino || '-'}
                                   <button type="submit" class="btn btn-warning btn-sm">Desfazer</button>`}
                        </form>
                    </div>`;

                } else if (['feedback_positivo', 'reducao_chamados', 'reducao_tma'].includes(grupo.type)) {
                    html += `<div class="meta" style="color:#8a7a6a;">
                        ${!done
                            ? '<em>Aguardando Aprova\u00e7\u00e3o da Divindade...</em>'
                            : `<strong style="color:#5cb85c;">+${s.pontos} XP</strong> — Atribuído pelo administrador`}
                    </div>`;
                }

                div.innerHTML = html;
                list.appendChild(div);
            }
        }

        async function handleToggle(e, activityId, activityType) {
            e.preventDefault();
            const form = e.target;
            const fd = new FormData(form);
            const userId = currentUser.uid;

            const snap = await db.collection('activities').where('user_id', '==', userId).get();
            const acts = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            const act = acts.find(a => a.id === activityId);
            if (!act) return;

            const completed = !act.completed;
            const updates = {
                pontos: completed ? (PONTOS[activityType] || 0) : 0,
                data_inicio: undefined,
                data_termino: undefined,
                modulo: undefined,
            };

            if (activityType === 'escolher_modulo') {
                const modulo = fd.get('modulo');
                if (completed && !modulo) return showError('Informe o nome do Módulo/Sistema');
                updates.modulo = completed ? modulo : null;
            }

            if (['iniciar_estudos', 'iniciar_material', 'material_aprovado'].includes(activityType)) {
                const data = fd.get('data_inicio');
                if (completed && !data) return showError('Informe a data');
                updates.data_inicio = completed ? data : null;
            }

            if (activityType === 'concluir_estudos') {
                const data = fd.get('data_conclusao');
                if (completed && !data) return showError('Informe a data de conclusão');
                updates.data_termino = completed ? data : null;
            }

            if (activityType === 'ministrar_aula') {
                const data = fd.get('data_aula');
                if (completed && !data) return showError('Informe a data da aula');
                updates.data_termino = completed ? data : null;
            }

            try {
                await toggleStep(activityId, completed, updates);
                await recalcScore(userId);
                showSuccess('Missão atualizada!');
                loadDashboard();
            } catch (err) {
                showError(err.message);
            }
            return false;
        }

        async function handleLink(e, activityId) {
            e.preventDefault();
            const link = e.target.querySelector('input[name="link"]').value.trim();
            if (!link) return showError('Informe o link do material.');
            try {
                await updateLink(activityId, link);
                showSuccess('Material enviado para revisão!');
                loadDashboard();
            } catch (err) {
                showError(err.message);
            }
            return false;
        }

        document.getElementById('logoutBtn').addEventListener('click', async (e) => {
            e.preventDefault();
            await logout();
            window.location.href = 'index.html';
        });

        auth.onAuthStateChanged(u => {
            const link = document.getElementById('adminLink');
            if (link) link.style.display = u && isAdmin(u) ? '' : 'none';
        });

        loadDashboard();
    </script>
</body>
</html>
