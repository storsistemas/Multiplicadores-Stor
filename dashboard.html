<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Multiplicadores Stor</title>
    <link rel="stylesheet" href="style.css?v=2">
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <script src="js/config.js?v=2"></script>
    <script src="js/app.js?v=2"></script>
</head>
<body>
    <div class="header">
        <h1>Multiplicadores Stor</h1>
    </div>
    <div class="nav">
        <a href="index.html">&#x1F3E0; Home</a>
        <a href="dashboard.html">&#x1F5E1; Missões</a>
        <a href="ranking.html">&#x1F451; Ranking</a>
        <a href="#" id="logoutBtn">&#x1F6AA; Sair</a>
    </div>

    <div class="container">
        <div id="flash"></div>

        <div class="highlight-card">
            <h2>&#x1F3F9; Em Destaque</h2>
            <div style="margin-top:15px">
                <div class="stat">
                    <div class="stat-label">Nome</div>
                    <div class="stat-value" id="userName">-</div>
                </div>
                <div class="stat">
                    <div class="stat-label">Rank</div>
                    <div class="stat-value" id="userRank">#-</div>
                </div>
                <div class="stat">
                    <div class="stat-label">Pontuação</div>
                    <div class="stat-value" id="userScore">0 pts</div>
                </div>
            </div>
        </div>

        <div class="card">
            <h3>&#x1F4DC; Lista das Missões</h3>
            <div id="activitiesList"></div>
        </div>
    </div>

    <script>
        let currentUser = null;

        async function loadDashboard() {
            const user = await requireAuth();
            if (!user) return;
            currentUser = user;

            const profile = await getProfile(user.uid);
            if (!profile) return;
            document.getElementById('userName').textContent = profile.name;
            document.getElementById('userScore').textContent = profile.total_score + ' pts';

            const ranking = await getRanking();
            const rankPos = ranking.findIndex(u => u.id === user.uid) + 1;
            document.getElementById('userRank').textContent = '#' + rankPos;

            const activities = await getActivities(user.uid);
            const list = document.getElementById('activitiesList');
            list.innerHTML = '';

            for (const act of activities) {
                const info = ATIVIDADES.find(a => a.type === act.activity_type);
                const div = document.createElement('div');
                div.className = 'activity-item' + (act.completed ? ' completed' : '');

                let html = `<div class="title">${act.completed ? '&#x2705;' : '&#x2B1C;'} ${info.label}`;
                if (act.completed) html += ` <span class="badge badge-success">+${act.pontos} pts</span>`;
                html += '</div>';

                if (act.activity_type === 'voluntariar') {
                    html += `<div class="meta">
                        <form onsubmit="return handleToggle(event, '${act.id}')">
                            ${!act.completed
                                ? '<button type="submit" class="btn btn-success btn-sm">Aceitar Missão</button>'
                                : '<button type="submit" class="btn btn-warning btn-sm">Desfazer</button>'}
                        </form>
                    </div>`;

                } else if (act.activity_type === 'escolher_modulo') {
                    html += `<div class="meta">
                        <form onsubmit="return handleToggle(event, '${act.id}')">
                            ${!act.completed
                                ? `<input type="text" name="modulo" class="inline-input" placeholder="Nome do M\u00f3dulo/Sistema" required>
                                   <button type="submit" class="btn btn-success btn-sm">Escolher</button>`
                                : `<strong>M\u00f3dulo:</strong> ${act.modulo || '-'}
                                   <button type="submit" class="btn btn-warning btn-sm" style="margin-left:10px">Desfazer</button>`}
                        </form>
                    </div>`;

                } else if (act.activity_type === 'iniciar_estudos') {
                    html += `<div class="meta">
                        <form onsubmit="return handleToggle(event, '${act.id}')">
                            ${!act.completed
                                ? `<input type="date" name="data_inicio" class="inline-input" required>
                                   <button type="submit" class="btn btn-success btn-sm">Iniciar Estudos</button>`
                                : `<strong>Data de in\u00edcio:</strong> ${act.data_inicio || '-'}
                                   <button type="submit" class="btn btn-warning btn-sm" style="margin-left:10px">Desfazer</button>`}
                        </form>
                    </div>`;

                } else if (act.activity_type === 'terminar_estudos') {
                    html += `<div class="meta">
                        <form onsubmit="return handleToggle(event, '${act.id}')">
                            ${!act.completed
                                ? `<input type="date" name="data_termino" class="inline-input" required>
                                   <button type="submit" class="btn btn-success btn-sm">Concluir Estudos</button>`
                                : `<strong>Data de t\u00e9rmino:</strong> ${act.data_termino || '-'}
                                   <button type="submit" class="btn btn-warning btn-sm" style="margin-left:10px">Desfazer</button>`}
                        </form>
                    </div>`;

                } else if (act.activity_type === 'concluir_estudos') {
                    html += `<div class="meta">
                        <form onsubmit="return handleToggle(event, '${act.id}')">
                            ${!act.completed
                                ? `<input type="date" name="data_conclusao" class="inline-input" required>
                                   <button type="submit" class="btn btn-success btn-sm">Concluir os Estudos</button>`
                                : `<strong>Data de conclus\u00e3o:</strong> ${act.data_termino || '-'}
                                   <button type="submit" class="btn btn-warning btn-sm" style="margin-left:10px">Desfazer</button>`}
                        </form>
                    </div>`;

                } else if (act.activity_type === 'iniciar_material') {
                    html += `<div class="meta">
                        <form onsubmit="return handleToggle(event, '${act.id}')">
                            ${!act.completed
                                ? `<input type="date" name="data_inicio" class="inline-input" required>
                                   <button type="submit" class="btn btn-success btn-sm">Forjar Material</button>`
                                : `<strong>Data de in\u00edcio:</strong> ${act.data_inicio || '-'}
                                   <button type="submit" class="btn btn-warning btn-sm" style="margin-left:10px">Desfazer</button>`}
                        </form>
                    </div>`;

                } else if (act.activity_type === 'terminar_material') {
                    html += `<div class="meta">
                        <form onsubmit="return handleToggle(event, '${act.id}')">
                            ${!act.completed
                                ? `<input type="date" name="data_termino" class="inline-input" required>
                                   <button type="submit" class="btn btn-success btn-sm">Finalizar Material</button>`
                                : `<strong>Data de t\u00e9rmino:</strong> ${act.data_termino || '-'}
                                   <button type="submit" class="btn btn-warning btn-sm" style="margin-left:10px">Desfazer</button>`}
                        </form>
                    </div>
                    <div class="link-info">
                        <strong>Link do Material:</strong>
                        ${act.link ? `<a href="${act.link}" target="_blank">${act.link}</a>` : ''}
                        <form onsubmit="return handleLink(event, '${act.id}')" style="margin-top:5px">
                            <input type="url" name="link" class="inline-input" placeholder="URL do material" value="${act.link || ''}" style="width:300px">
                            <button type="submit" class="btn btn-primary btn-sm">Registrar Artefato</button>
                        </form>
                    </div>`;

                } else if (act.activity_type === 'ministrar_aula') {
                    html += `<div class="meta">
                        <form onsubmit="return handleToggle(event, '${act.id}')">
                            ${!act.completed
                                ? `<input type="date" name="data_aula" class="inline-input" required>
                                   <button type="submit" class="btn btn-success btn-sm">Registrar Aula</button>`
                                : `<strong>Data da aula:</strong> ${act.data_termino || '-'}
                                   <button type="submit" class="btn btn-warning btn-sm" style="margin-left:10px">Desfazer</button>`}
                        </form>
                    </div>`;
                }

                div.innerHTML = html;
                list.appendChild(div);
            }
        }

        async function handleToggle(e, activityId) {
            e.preventDefault();
            const form = e.target;
            const fd = new FormData(form);
            const activities = await getActivities(currentUser.uid);
            const activity = activities.find(a => a.id === activityId);
            if (!activity) return;

            try {
                await toggleActivity(activity, fd);
                showSuccess('Atividade atualizada!');
                loadDashboard();
            } catch (err) {
                showError(err.message);
            }
            return false;
        }

        async function handleLink(e, activityId) {
            e.preventDefault();
            const link = e.target.querySelector('input[name="link"]').value.trim();
            if (!link) return showError('Informe o link do material.');
            try {
                await updateLink(activityId, link);
                showSuccess('Link salvo!');
                loadDashboard();
            } catch (err) {
                showError(err.message);
            }
            return false;
        }

        document.getElementById('logoutBtn').addEventListener('click', async (e) => {
            e.preventDefault();
            await logout();
            window.location.href = 'index.html';
        });

        loadDashboard();
    </script>
</body>
</html>
